name: Verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check services scripts tests
      - run: python -m pytest -q
      - run: |
          python -m scripts.pipeline download
          python -m scripts.pipeline prepare
          python -m scripts.pipeline train
          python -m scripts.pipeline evaluate
      - run: python -m scripts.benchmark
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run check
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run build
        env:
          NEXT_PUBLIC_FEEDCRAFT_API: http://127.0.0.1:8000
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - run: |
          python -m uvicorn services.api.app:app --host 127.0.0.1 --port 8000 --no-access-log &
          api=$!
          trap 'kill "$api"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:8000/health
          FEEDCRAFT_TEST_API=1 FEEDCRAFT_SCREENSHOTS=1 npm --prefix apps/web run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: apps/web/test-results
          if-no-files-found: ignore
      - name: Build software bills of materials
        run: |
          npm --prefix apps/web sbom --sbom-format cyclonedx > web-sbom.json
          python -m pip install cyclonedx-bom pip-audit
          cyclonedx-py requirements requirements.txt -o python-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: '*-sbom.json'
      - run: npm --prefix apps/web audit --audit-level=high
      - run: pip-audit -r requirements.txt
      - name: Scan Git history for secrets
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 git --redact /repo
